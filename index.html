<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #111, #222);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    p {
      font-size: 1.2rem;
      color: #ccc;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 20px;
      color: #ff6b00;
    }

    .email-box input {
      padding: 12px;
      width: 70%;
      border: none;
      border-radius: 5px 0 0 5px;
      outline: none;
    }

    .email-box button {
      padding: 12px;
      border: none;
      background: #ff6b00;
      color: white;
      cursor: pointer;
      border-radius: 0 5px 5px 0;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">🍽️ Indian Taste In Germany</div>

    <h1>Coming Soon</h1>
    <p>We are preparing something delicious for you.</p>

    <div class="email-box">
      <input type="email" placeholder="brijvachhaniphotography@gmail.com">
      <button>Notify Me</button>
    </div>

    <div class="footer">
      © 2026 Your Restaurant. All rights reserved.
    </div>
  </div>
</body>
</html>
