<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ITIG - Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85)),
      url('https://images.unsplash.com/photo-1555992336-03a23c3b7b02');
      background-size: cover;
      background-position: center;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      max-width: 700px;
      padding: 20px;
    }

    .logo {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #f5b041;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    p {
      color: #ddd;
      margin-bottom: 30px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .time-box {
      background: rgba(255,255,255,0.1);
      padding: 15px 20px;
      border-radius: 8px;
    }

    .time-box span {
      display: block;
      font-size: 1.8rem;
      font-weight: bold;
    }

    .email-box input {
      padding: 12px;
      width: 65%;
      border: none;
      outline: none;
      border-radius: 5px 0 0 5px;
    }

    .email-box button {
      padding: 12px;
      border: none;
      background: #f5b041;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border-radius: 0 5px 5px 0;
    }

    .location {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #bbb;
    }

    .footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: #777;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">ITIG</div>

    <h1>Coming Soon</h1>
    <p>A new aesthetic dining experience is arriving soon.</p>

    <div class="countdown">
      <div class="time-box">
        <span id="days">00</span>
        Days
      </div>
      <div class="time-box">
        <span id="hours">00</span>
        Hours
      </div>
      <div class="time-box">
        <span id="minutes">00</span>
        Minutes
      </div>
      <div class="time-box">
        <span id="seconds">00</span>
        Seconds
      </div>
    </div>

    <div class="email-box">
      <input type="email" placeholder="Enter your email">
      <a href="mailto:your@email.com">
        <button>Notify Me</button>
      </a>
    </div>

    <div class="location">
      📍 Opening in Germany | Launching Soon
    </div>

    <div class="footer">
      © 2026 ITIG. All rights reserved.
    </div>
  </div>

  <script>
    const launchDate = new Date("June 15, 2026 18:00:00").getTime();

    const timer = setInterval(function() {
      const now = new Date().getTime();
      const distance = launchDate - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((distance / 1000 / 60) % 60);
      const seconds = Math.floor((distance / 1000) % 60);

      document.getElementById("days").innerHTML = days;
      document.getElementById("hours").innerHTML = hours;
      document.getElementById("minutes").innerHTML = minutes;
      document.getElementById("seconds").innerHTML = seconds;

      if (distance < 0) {
        clearInterval(timer);
        document.querySelector(".countdown").innerHTML = "We are now open!";
      }
    }, 1000);
  </script>

</body>
</html>
