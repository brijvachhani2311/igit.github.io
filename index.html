<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ITIG - Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      height: 100vh;

      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.85)),
      url('https://images.unsplash.com/photo-1555992336-03a23c3b7b02');
      background-size: cover;
      background-position: center;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      max-width: 500px;
      padding: 20px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
      letter-spacing: 3px;
      color: #f5b041;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      color: #ddd;
      margin-bottom: 25px;
    }

    .timer {
      font-size: 22px;
      margin-bottom: 25px;
    }

    input {
      padding: 10px;
      width: 65%;
      border: none;
    }

    button {
      padding: 10px;
      border: none;
      background: #f5b041;
      font-weight: bold;
      cursor: pointer;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>ITIG</h1>
    <h2>Coming Soon</h2>
    <p>Where taste meets aesthetic experience.</p>

    <div class="timer" id="timer"></div>

    <div>
      <input type="email" placeholder="Enter your email">
      <a href="mailto:your@email.com">
        <button>Notify</button>
      </a>
    </div>

    <p>📍 Germany | Opening Soon</p>

    <div class="footer">
      © 2026 ITIG
    </div>
  </div>

  <script>
    const launchDate = new Date("June 15, 2026 18:00:00").getTime();

    setInterval(function() {
      const now = new Date().getTime();
      const diff = launchDate - now;

      const d = Math.floor(diff / (1000*60*60*24));
      const h = Math.floor((diff / (1000*60*60)) % 24);
      const m = Math.floor((diff / (1000*60)) % 60);
      const s = Math.floor((diff / 1000) % 60);

      document.getElementById("timer").innerHTML =
        d + "d " + h + "h " + m + "m " + s + "s";

    }, 1000);
  </script>

</body>
</html>
